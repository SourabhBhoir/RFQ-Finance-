<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>BidForge Register</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>BidForge Registration</h2>

    <form th:action="@{/register}" method="post">

        <div class="mb-3">

            <label>Name</label>

            <input
                    type="text"
                    name="name"
                    class="form-control"
                    required>

        </div>

        <div class="mb-3">

            <label>Email</label>

            <input
                    type="email"
                    name="email"
                    class="form-control"
                    required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

        </div>

        <div class="mb-3">

            <label>Role</label>

            <select name="role" class="form-control">

                <option value="VENDOR">VENDOR</option>
                <option value="ADMIN">ADMIN</option>

            </select>

        </div>

        <button type="submit" class="btn btn-primary">
            Register
        </button>

    </form>

</div>

</body>
</html>
